function leafPath(rx,ry){return `M0 0 C ${rx*.3} ${-ry*1.3} ${rx*.8} ${-ry*1.2} ${rx} 0 C ${rx*.8} ${ry*1.2} ${rx*.3} ${ry*1.3} 0 0Z`}
for(const id in LEAVES){const L=LEAVES[id];const d=leafPath(L.rx,L.ry);
  const r=$(id+'_r');r.setAttribute('x1',L.r0);r.setAttribute('x2',L.r1);r.setAttribute('y1',L.y);r.setAttribute('y2',L.y);
  for(let i=0;i<L.n;i++){$(id+'_u'+i).setAttribute('d',d);$(id+'_l'+i).setAttribute('d',d);}}
function setLeaf(id,thetaOf){const L=LEAVES[id];
  for(let i=0;i<L.n;i++){const th=thetaOf(i),x=L.x0+i*L.sp;
    $(id+'_u'+i).setAttribute('transform',`translate(${x} ${L.y}) rotate(${-th})`);
    $(id+'_l'+i).setAttribute('transform',`translate(${x} ${L.y}) rotate(${th})`);}}

/* ---------- yazı katmanı ---------- */
const FS=62,LH=84,YC=1560;
const tl=document.createElementNS(NS,'g');svg.appendChild(tl);
const mc=document.createElement('canvas').getContext('2d');
mc.font=`700 ${FS}px Inter`;
const TXT=TIMELINE.text.map(it=>{
  const g=document.createElementNS(NS,'g');
  const w=Math.max(...it.lines.map(l=>mc.measureText(l).width));
  const bh=it.lines.length*LH;
  let h='';
  if(it.pill)h+=`<rect x="${540-w/2-44}" y="${YC-bh/2-30}" width="${w+88}" height="${bh+60}" rx="40" fill="${C.pill}" fill-opacity=".88"/>`;
  it.lines.forEach((l,i)=>{h+=`<text x="540" y="${YC-bh/2+i*LH+60}" text-anchor="middle" font-size="${FS}" font-weight="700" fill="${it.pill?C.cream:C.ink}">${l}</text>`});
  g.innerHTML=h;tl.appendChild(g);return g;});

/* ---------- seek ---------- */
function sceneOp(id,t){const S=TIMELINE.scenes,i=S.findIndex(x=>x.id===id),sc=S[i];
  const inn=i===0?1:pr(t,sc.t0,.5);
  let out=1;
  if(i<S.length-1){out=sc.fadeOut?1-pr(t,sc.t1,.5):(t<sc.t1+.5?1:0);}
  return inn*out;}
function camAt(t){const K=TIMELINE.camera;let i=0;while(i<K.length-2&&t>=K[i+1].t)i++;
  const a=K[i],c=K[i+1],k=ease((t-a.t)/(c.t-a.t));
  const z=lerp(a.z,c.z,k);
  return{z,cx:clamp(lerp(a.cx,c.cx,k),540/z,1536-540/z),cy:clamp(lerp(a.cy,c.cy,k),960/z,1920-960/z)};}

const droneRng=mulberry32(7);const DROPX=[...Array(6)].map(()=>droneRng());
$('drops').innerHTML=DROPX.map((_,i)=>`<circle id="dr${i}" r="11" cx="250" cy="1080" opacity="0"/>`).join('');

function seek(t){
  t=clamp(t,0,TIMELINE.duration);
  const cam=camAt(t);
  $('photo').setAttribute('transform',`translate(540 960) scale(${cam.z}) translate(${-cam.cx} ${-cam.cy})`);
  for(const s of TIMELINE.scenes){const g=$('sc_'+s.id);if(!g)continue;const o=sceneOp(s.id,t);g.setAttribute('opacity',o);g.style.display=o>0.001?'':'none';}

  /* S2 */
  setLeaf('lf2',i=>lerp(78,7,pr(t,b(14.2)+(6-i)*.12,1.2)));
  const tr=pr(t,b(10.5),.8);
  $('touchring').setAttribute('r',60*tr);$('touchring').setAttribute('opacity',t>=b(10.5)?1-tr:0);
  const sg=clamp((t-b(11.5))/(b(14)-b(11.5)));
  $('sigdot').setAttribute('cx',lerp(900,250,REDUCED?(sg>0?1:0):sg*sg*(3-2*sg)));
  $('sigdot').setAttribute('opacity',t>=b(11.5)&&t<b(14)+.2?1:0);
  const dr=pr(t,b(13.2),b(2));
  $('joint').setAttribute('r',lerp(40,24,dr));
  DROPX.forEach((rx,i)=>{const k=clamp((t-b(13.2)-i*.18)/.9);
    const e=REDUCED?(k>0?1:0):k;
    const c=$('dr'+i);c.setAttribute('cx',250+(rx-.5)*70);c.setAttribute('cy',1090+38+e*120);
    c.setAttribute('opacity',(k>0&&k<1)||(REDUCED&&k>0&&t<b(15))?1-(REDUCED?0:k*k):0);});

  /* S3 */
  const g1=pr(t,b(27),b(3.5)),g2=pr(t,b(27.6),b(3.5));
  $('bar1').setAttribute('height',18.9*16*g1);$('bar1').setAttribute('y',1300-18.9*16*g1);
  $('bar2').setAttribute('height',38*16*g2);$('bar2').setAttribute('y',1300-38*16*g2);
  const fmt=v=>'%'+v.toFixed(1).replace('.',',');
  $('val1').textContent=g1>0.02?fmt(18.9*g1):'';$('val1').setAttribute('y',1300-18.9*16*g1-20);
  $('val2').textContent=g2>0.02?fmt(38*g2):'';$('val2').setAttribute('y',1300-38*16*g2-20);
  $('x2').setAttribute('opacity',pr(t,b(33),.7));
  $('x2').setAttribute('transform',`translate(0 ${(1-pr(t,b(33),.7))*30})`);

  /* S4 */
  $('sun4').setAttribute('opacity',pr(t,b(40.5),.8));
  setLeaf('lf4',()=>7);$('lf4').setAttribute('opacity',pr(t,b(41),.8));
  const nk=pr(t,b(42),.8);
  $('n47').setAttribute('opacity',nk);$('n47').setAttribute('transform',`translate(0 ${(1-nk)*40})`);
  $('n47l').setAttribute('opacity',pr(t,b(43),.6));
  const gk=pr(t,b(45),b(3));
  $('gauge').setAttribute('width',376*gk);$('gauge').setAttribute('x',940-376*gk);
  $('gl').setAttribute('opacity',pr(t,b(47.5),.6));

  /* S5 */
  const dk=pr(t,b(57),.7),nk5=pr(t,b(60),.7);
  $('dayp').setAttribute('opacity',dk);$('nightp').setAttribute('opacity',nk5);
  setLeaf('lf5a',()=>78);setLeaf('lf5b',i=>lerp(78,7,pr(t,b(62)+(3-i)*.1,1.2)));

  /* yazı */
  TIMELINE.text.forEach((it,i)=>{const g=TXT[i];
    const k=pr(t,it.t0,.6),o=1-pr(t,it.t1-.4,.4);
    g.setAttribute('opacity',k*o);g.setAttribute('transform',`translate(0 ${(1-k)*24})`);});
}
window.TIMELINE=TIMELINE;window.seek=seek;seek(0);

/* ---------- ses ---------- */
window.renderAudio=async function(){
  const SR=48000,dur=TIMELINE.duration+1.2;
  const oc=new OfflineAudioContext(2,Math.ceil(SR*dur),SR);
  const comp=oc.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(oc.destination);
  const master=oc.createGain();master.gain.setValueAtTime(.9,0);
  master.gain.setValueAtTime(.9,b(76));master.gain.linearRampToValueAtTime(0.0001,TIMELINE.duration+.9);
  master.connect(comp);
  const rng=mulberry32(11);
  const env=(g,t,a,d,pk)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);};
  const tone=(t,f,d,pk,type='triangle',lp=2600,pan=0,a=.015)=>{
    const o=oc.createOscillator();o.type=type;o.frequency.value=f;
    const g=oc.createGain();env(g,t,a,d,pk);
    const l=oc.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;
    const p=oc.createStereoPanner();p.pan.value=pan;
    o.connect(l);l.connect(g);g.connect(p);p.connect(master);o.start(t);o.stop(t+a+d+.05);};
  const sweep=(t,f0,f1,d,pk,type='sine')=>{
    const o=oc.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
    const g=oc.createGain();env(g,t,d*.2,d*.8,pk);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1);};
  const noise=(t,d,pk,hp)=>{
    const buf=oc.createBuffer(1,Math.ceil(SR*d),SR),x=buf.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=rng()*2-1;
    const s=oc.createBufferSource();s.buffer=buf;const f=oc.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
    const g=oc.createGain();env(g,t,.01,d,pk);s.connect(f);f.connect(g);g.connect(master);s.start(t);};
  const hz=m=>440*Math.pow(2,(m-69)/12);
  /* altyapı: Am – F – C – G, 8 vuruşluk akor, 90 BPM */
  const CH=[[45,52,57,60],[41,48,53,57],[48,55,60,64],[43,50,55,59]];
  for(let c=0;c<10;c++){const t0=b(c*8),ch=CH[c%4];
    ch.forEach((m,i)=>{const o=oc.createOscillator();o.type=i<1?'sine':'triangle';o.frequency.value=hz(m);o.detune.value=(i-1.5)*4;
      const g=oc.createGain();const pk=i<1?.07:.03;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(pk,t0+b(1.5));g.gain.setValueAtTime(pk,t0+b(7));g.gain.linearRampToValueAtTime(0,t0+b(8.5));
      const l=oc.createBiquadFilter();l.type='lowpass';l.frequency.value=900;
      o.connect(l);l.connect(g);g.connect(master);o.start(t0);o.stop(t0+b(8.6));});
    for(let k=0;k<16;k++){const t=t0+k*b(.5);if(t<b(2))continue;
      const m=ch[1+[0,1,2,1,2,3,2,1][k%8]%3]+12;
      tone(t,hz(m),.5,.028,'triangle',2400,(k%2?.3:-.3));}}
  /* cue'lar */
  const motif=t=>{[69,72,76].forEach((m,i)=>{tone(t+i*b(.5),hz(m),.9,.07,'sine',4000,0,.01);tone(t+i*b(.5),hz(m+12),.6,.025,'sine',5000,0,.01);});};
  for(const[name,bt]of TIMELINE.cues){const t=b(bt);
    if(name==='motif')motif(t);
    else if(name==='touch'){noise(t,.12,.06,3000);tone(t,880,.15,.07,'sine');}
    else if(name==='signal')sweep(t,380,900,b(2.5),.04);
    else if(name==='drops'){for(let i=0;i<5;i++)sweep(t+i*.18,1300-i*80,700,.16,.05);}
    else if(name==='fold')sweep(t,520,230,b(3),.045);
    else if(name==='grow')sweep(t,260,700,b(3.5),.05,'triangle');
    else if(name==='thud'){tone(t,70,.5,.2,'sine',300);}
    else if(name==='chime2x'){tone(t,hz(76),1.2,.07,'sine',5000);tone(t+.08,hz(83),1.2,.05,'sine',5000);}
    else if(name==='thud2'){tone(t,52,.9,.28,'sine',250);noise(t,.2,.03,800);}
    else if(name==='swish'){noise(t,b(3),.035,1800);}
    else if(name==='chimeDay'){tone(t,hz(79),1,.06,'sine',5000);tone(t+.14,hz(84),1,.04,'sine',5000);}
    else if(name==='chimeNight'){tone(t,hz(64),1.4,.07,'sine',3000);tone(t+.18,hz(59),1.4,.05,'sine',3000);}
    else if(name==='resolve'){[57,64,69,72].forEach((m,i)=>tone(t+i*.03,hz(m),b(3.5),.05,'sine',3500,0,.05));}}
  const buf=await oc.startRendering();
  const L=buf.getChannelData(0),R=buf.getChannelData(1),n=L.length,out=new Int16Array(n*2);
  for(let i=0;i<n;i++){out[2*i]=clamp(L[i],-1,1)*32767;out[2*i+1]=clamp(R[i],-1,1)*32767;}
  const bytes=new Uint8Array(out.buffer);let bin='';const CH2=0x8000;
  for(let i=0;i<bytes.length;i+=CH2)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH2));
  return btoa(bin);
};
