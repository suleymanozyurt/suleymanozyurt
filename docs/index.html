<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#23783a"><title>Orman Parkları Kira Hesaplama Modeli</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f6f1;color:#153b24;font-family:system-ui,-apple-system,Segoe UI,Arial}main{width:min(460px,calc(100% - 36px));padding:26px;border:1px solid #d5e3d5;border-radius:16px;background:white;box-shadow:0 12px 32px #173b2420}h1{font-size:20px;margin:0 0 7px}p{font-size:14px;line-height:1.5;margin:0}.bar{height:8px;border-radius:99px;background:#dfecdf;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:32%;background:#277b43;border-radius:99px;animation:go 1.1s ease-in-out infinite alternate}@keyframes go{to{transform:translateX(190%)}}</style></head><body><main><h1>🌲 Orman Parkları Kira Hesaplama Modeli</h1><p id="status">Uygulama hazırlanıyor…</p><div class="bar"><i></i></div></main><script>
(async()=>{const q=document.querySelector('#status');try{const paths=['assets/app.part0.txt','assets/app.part1.txt','assets/app.part2.txt','assets/app.part3.txt','assets/app.part4.txt'];q.textContent='Uygulama dosyaları yükleniyor…';const parts=await Promise.all(paths.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' yüklenemedi ('+r.status+')');return r.text()})));q.textContent='Uygulama açılıyor…';const b64=parts.join('').replace(/\s/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Tarayıcı güncel değil. Chrome, Edge, Firefox veya Safari’nin güncel sürümünü kullanın.');const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();if(!html.startsWith('<!doctype html>'))throw new Error('Uygulama paketi doğrulanamadı.');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main><h1>Uygulama açılamadı</h1><p>'+String(e.message).replace(/[<>&]/g,'')+'</p><p style="margin-top:12px">Sayfayı yenileyin. Sorun sürerse bağlantıyı yeniden deneyin.</p></main>'}})();
</script></body></html>
